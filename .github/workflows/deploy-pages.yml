name: Publish Kagel to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /kagel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run timer tests
        run: npm test
      - name: Build Next.js static site
        run: npm run build
      - name: Check static export and PWA resources
        run: |
          test -s out/index.html
          test -s out/sw.js
          test -s out/manifest.webmanifest
          test -s out/icons/icon-512.png
          grep -q '/kagel/_next/' out/index.html
          node -e 'const fs=require("node:fs"); const m=JSON.parse(fs.readFileSync("out/manifest.webmanifest","utf8")); if(m.start_url!=="/kagel/"||m.icons.some(x=>!x.src.startsWith("/kagel/")))process.exit(1)'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
